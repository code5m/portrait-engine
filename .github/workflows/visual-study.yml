name: Visual study (headless Chromium)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'styles/**'
      - 'scripts/**'
      - 'test/**'
      - 'index.html'
      - 'standalone.html'
      - 'study/**'
      - '.github/workflows/**'
      - 'research/**'
  pull_request:
    paths:
      - 'src/**'
      - 'styles/**'
      - 'scripts/**'
      - 'test/**'
      - 'index.html'
      - 'standalone.html'
      - 'study/**'
      - '.github/workflows/**'
      - 'research/**'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run real browser checks
        run: |
          npm run build
          PORTRAIT_QA_DIR=test-results/research-002 python test/browser-qa.py
          python test/research-matrix.py
          python test/hair-probe.py
          python test/study005-visual.py
          python test/study006-visual.py
          python test/study007-visual.py
          python test/study008-visual.py
          python test/study009-visual.py
          python scripts/build-r010-study.py --check
          python test/study010-visual.py
          python test/study010-offline-visual.py
          python test/engine-v1-visual.py
      - name: Upload reproducible visual evidence (not runtime assets)
        if: always()
        continue-on-error: true  # Quota outage must not misreport passing Chromium QA as failing.
        uses: actions/upload-artifact@v4
        with:
          name: research-010-css-human-blind-protocol
          path: |
            test-results/research-004/
            test-results/research-005/
            test-results/research-006/
            test-results/research-007/
            test-results/research-008/
            test-results/research-009/
            test-results/research-010/
            test-results/face-engine-v1/
          if-no-files-found: warn
          retention-days: 21
