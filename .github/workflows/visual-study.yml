name: Visual study (headless Chromium)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'styles/**'
      - 'src/geometry.mjs'
      - 'src/volume.mjs'
      - 'src/face-model.mjs'
      - 'src/surface-field.mjs'
      - 'src/stroke-field.mjs'
      - 'src/app.mjs'
      - 'index.html'
      - 'scripts/build-standalone.py'
      - 'test/study007-visual.py'
      - 'test/study008-visual.py'
      - 'test/study009-visual.py'
      - 'test/study010-visual.py'
      - 'study/010-*.html'
      - 'study/010-*.mjs'
      - 'src/blind010.mjs'
      - 'study/009-*.html'
      - 'study/007-*.html'
      - 'study/008-*.html'
      - 'test/research-matrix.py'
      - 'test/browser-qa.py'
  pull_request:
    paths:
      - 'styles/**'
      - 'src/geometry.mjs'
      - 'src/volume.mjs'
      - 'src/face-model.mjs'
      - 'src/surface-field.mjs'
      - 'src/stroke-field.mjs'
      - 'src/app.mjs'
      - 'index.html'
      - 'scripts/build-standalone.py'
      - 'test/study007-visual.py'
      - 'test/study008-visual.py'
      - 'test/study009-visual.py'
      - 'test/study010-visual.py'
      - 'study/010-*.html'
      - 'study/010-*.mjs'
      - 'src/blind010.mjs'
      - 'study/009-*.html'
      - 'study/007-*.html'
      - 'study/008-*.html'
      - 'test/research-matrix.py'
      - 'test/browser-qa.py'
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run real browser checks
        run: |
          npm run build
          PORTRAIT_QA_DIR=test-results/research-002 python test/browser-qa.py
          python test/research-matrix.py
          python test/hair-probe.py
          python test/study005-visual.py
          python test/study006-visual.py
          python test/study007-visual.py
          python test/study008-visual.py
          python test/study009-visual.py
          python scripts/build-r010-study.py --check
          python test/study010-visual.py
      - name: Upload reproducible visual evidence (not runtime assets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-010-css-human-blind-protocol
          path: |
            test-results/research-004/
            test-results/research-005/
            test-results/research-006/
            test-results/research-007/
            test-results/research-008/
            test-results/research-009/
            test-results/research-010/
          if-no-files-found: warn
          retention-days: 21
