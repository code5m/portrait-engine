name: Sketch failure diagnostic
on:
  push:
    branches: [research/sketch-s3-s4]
    paths: ['.github/workflows/sketch-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Extract bounded error context from prior run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os, urllib.request
          base='https://api.github.com/repos/'+os.environ['REPOSITORY']+'/actions/jobs/'
          for job in [116803666523,116803666620]:
              request=urllib.request.Request(base+str(job)+'/logs',headers={'Accept':'application/vnd.github+json'})
              request.add_unredirected_header('Authorization','Bearer '+os.environ['GH_TOKEN'])
              with urllib.request.urlopen(request,timeout=40) as response:
                  text=response.read(16000000).decode('utf-8','replace')
              lines=text.splitlines()
              print('PRIOR_JOB',job)
              for i,line in enumerate(lines):
                  if 'Traceback (most recent call last)' in line:
                      print('\n'.join(x[:800] for x in lines[max(0,i-2):i+28]))
              print('TAIL', '\n'.join(x[:500] for x in lines[-18:]))
          PY
