name: Synchronize R012 standalone
on:
  push:
    branches: [research/012-human-form]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/012-human-form
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate and check native CSS bundle
        run: |
          npm run build
          python3 scripts/check-standalone.py
          git diff --check
      - name: Commit synchronized portable HTML
        run: |
          if ! git diff --quiet -- standalone.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add standalone.html
            git commit -m "build: synchronize R012 experimental CSS into standalone"
            git push origin HEAD:research/012-human-form
          fi
