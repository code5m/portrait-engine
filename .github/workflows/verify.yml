name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax, research policy, source contract, and offline build
        run: npm run verify
      - name: Ensure standalone build matches committed source
        run: git diff --exit-code -- standalone.html study/010-blind-offline.html study/010-results-offline.html
