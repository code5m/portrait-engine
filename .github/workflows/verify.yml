name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax, research policy, source contract, and offline build
        run: npm run verify
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install stage evidence verification dependencies
        run: python -m pip install -q numpy
      - name: Verify stage archive, image hashes, and human-review safety
        run: PYTHONPATH=workbench python -m unittest workbench.test_stage_archive -v
      - name: Ensure standalone build matches committed source
        run: git diff --exit-code -- standalone.html study/010-blind-offline.html study/010-results-offline.html
