name: R013 structural identity research
on:
  push:
    branches: [research/013-identity-geometry]
  pull_request:
    paths:
      - 'styles/research013.css'
      - 'src/anatomy/**'
      - 'src/face-dna.mjs'
      - 'src/face-geometry.mjs'
      - 'src/engine.mjs'
      - 'src/app.mjs'
      - 'test/research013-*'
      - 'scripts/build-standalone.py'
      - '.github/workflows/research013.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild portable CSS-only HTML and run tests
        run: |
          npm run verify
          git diff --check
      - name: Refuse generated source drift
        run: git diff --exit-code -- standalone.html
      - name: Install Chromium
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Render real browser A/B
        env:
          R013_PRINT_PREVIEW: "1"
        run: python test/research013-preview.py
