name: R013 structural identity research
on:
  push:
    branches: [research/013-identity-geometry]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/013-identity-geometry
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild portable CSS-only HTML and run tests
        run: |
          npm run verify
          git diff --check
      - name: Sync generated HTML for source parity
        run: |
          if ! git diff --quiet -- standalone.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add standalone.html
            git commit -m "build(research013): synchronize portable CSS rendering"
            git push origin HEAD:research/013-identity-geometry
          fi
      - name: Install Chromium
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Render real browser A/B
        env:
          R013_PRINT_PREVIEW: "1"
        run: python test/research013-preview.py
